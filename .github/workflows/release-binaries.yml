name: Release Waggle Binaries

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-binaries:
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            asset_name: waggle-mcp-darwin-arm64
            executable_name: waggle-mcp-darwin-arm64
            artifact_path: dist/waggle-mcp-darwin-arm64
          # macos-13 was retired; retain the x86_64 build on GitHub's supported Intel runner.
          - runner: macos-15-intel
            asset_name: waggle-mcp-darwin-x64
            executable_name: waggle-mcp-darwin-x64
            artifact_path: dist/waggle-mcp-darwin-x64
          - runner: ubuntu-latest
            asset_name: waggle-mcp-linux-x64
            executable_name: waggle-mcp-linux-x64
            artifact_path: dist/waggle-mcp-linux-x64
          - runner: windows-latest
            asset_name: waggle-mcp-windows-x64.exe
            executable_name: waggle-mcp-windows-x64
            artifact_path: dist/waggle-mcp-windows-x64.exe

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/mcp/graph-ui/package-lock.json

      - name: Build Graph Studio static assets
        working-directory: apps/mcp/graph-ui
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install . pyinstaller

      - name: Build standalone binary
        shell: bash
        run: |
          pyinstaller \
            --clean \
            --onefile \
            --name "${{ matrix.executable_name }}" \
            --collect-all waggle \
            --exclude-module sentence_transformers \
            --exclude-module torch \
            --exclude-module transformers \
            --exclude-module sklearn \
            --exclude-module scipy \
            --exclude-module huggingface_hub \
            --exclude-module tokenizers \
            --exclude-module safetensors \
            --exclude-module numpy.random \
            --exclude-module numpy.fft \
            --exclude-module numpy.testing \
            --exclude-module numpy.f2py \
            --exclude-module googleapiclient \
            --exclude-module google_auth_httplib2 \
            --exclude-module google.genai \
            --exclude-module pyvis \
            --exclude-module IPython \
            --exclude-module jedi \
            --exclude-module openai \
            --exclude-module anthropic \
            --exclude-module portkey_ai \
            src/waggle/entrypoints/cli.py

      - name: Smoke test binary
        shell: bash
        env:
          WAGGLE_MODEL: deterministic
          WAGGLE_STARTUP_MODE: fast
        run: |
          "${{ matrix.artifact_path }}" --help
          "${{ matrix.artifact_path }}" doctor --help

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.artifact_path }}

  upload-release-binaries:
    name: Upload ${{ matrix.asset_name }} to release
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset_name: waggle-mcp-darwin-arm64
            artifact_path: dist/waggle-mcp-darwin-arm64
          - asset_name: waggle-mcp-darwin-x64
            artifact_path: dist/waggle-mcp-darwin-x64
          - asset_name: waggle-mcp-linux-x64
            artifact_path: dist/waggle-mcp-linux-x64
          - asset_name: waggle-mcp-windows-x64.exe
            artifact_path: dist/waggle-mcp-windows-x64.exe

    steps:
      - name: Download built binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.asset_name }}
          path: dist

      - name: Upload release asset
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: ${{ matrix.artifact_path }}
          fail_on_unmatched_files: true

  publish-bundle-metadata:
    name: Publish bundle-metadata.json
    needs: upload-release-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Resolve release version
        id: version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            REF="$REF_NAME"
          else
            REF="$RELEASE_TAG"
          fi
          echo "value=${REF#v}" >> "$GITHUB_OUTPUT"

      - name: Download built binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: waggle-mcp-*
          merge-multiple: true

      - name: Generate bundle-metadata.json
        env:
          BUNDLE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          node apps/vscode-extension/scripts/generate-bundle-metadata.mjs \
            "$BUNDLE_VERSION" \
            dist/bundle-metadata.json \
            artifacts

      - name: Upload bundle-metadata artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-metadata
          path: dist/bundle-metadata.json

      - name: Upload bundle-metadata to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/bundle-metadata.json
          fail_on_unmatched_files: true
