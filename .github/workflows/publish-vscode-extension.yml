name: Publish VS Code Extension

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vscode-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/vscode-extension

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/vscode-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run extension validation tests
        run: npm test

      - name: Package VSIX
        env:
          WAGGLE_RELEASE_REPO: Abhigyan-Shekhar/Waggle-mcp
        run: npx @vscode/vsce package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: waggle-memory-vsix
          path: apps/vscode-extension/*.vsix

      - name: Publish to Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          WAGGLE_RELEASE_REPO: Abhigyan-Shekhar/Waggle-mcp
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::notice::VSCE_PAT not set; skipping marketplace publish."
            exit 0
          fi
          npx @vscode/vsce publish

      - name: Upload VSIX to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b
        with:
          files: apps/vscode-extension/*.vsix
