name: Publish Waggle Image

on:
  push:
    tags:
      - "v*"          # triggers on v0.1.12, v1.0.0, etc.
  workflow_dispatch:  # manual trigger for testing

permissions:
  contents: read
  packages: write

env:
  # GHCR image references must be lowercase; the GitHub account display name is not.
  IMAGE_NAME: ghcr.io/abhigyan-shekhar/waggle-mcp

jobs:
  build-and-push:
    name: Build & push pre-baked image
    runs-on: ubuntu-latest
    outputs:
      image-version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract version from the git tag (strips the leading "v")
      - name: Extract version metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # Immutable semver tag  →  ghcr.io/.../waggle-mcp:0.1.12
            type=semver,pattern={{version}}
            # Major.minor floating  →  ghcr.io/.../waggle-mcp:0.1
            type=semver,pattern={{major}}.{{minor}}
            # Rolling latest        →  ghcr.io/.../waggle-mcp:latest
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          # GitHub Actions layer cache — dramatically speeds up repeat builds
          cache-from: type=gha
          # The image push is authoritative; a transient cache-service failure must not fail the release.
          cache-to: type=gha,mode=max,ignore-error=true
          # Build for both amd64 and arm64 (Apple Silicon, AWS Graviton)
          platforms: linux/amd64,linux/arm64

  # ── Smoke-test the published image ─────────────────────────────────────────
  smoke-test:
    name: Smoke-test image
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Pull published image
        run: |
          docker pull ${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image-version }}

      - name: Verify tool listing responds instantly (fast mode)
        run: |
          # Fast mode must respond within 5 s with zero ML overhead
          timeout 5 docker run --rm \
            --entrypoint python \
            -e WAGGLE_STARTUP_MODE=fast \
            -e WAGGLE_TRANSPORT=stdio \
            ${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image-version }} \
            -c "
          from waggle.config import AppConfig
          from waggle.server import WaggleServer
          import os
          os.environ['WAGGLE_STARTUP_MODE'] = 'fast'
          os.environ['WAGGLE_DB_PATH'] = '/tmp/smoke-test.db'
          cfg = AppConfig.from_env()
          srv = WaggleServer(config=cfg)
          tools = srv.build_tools()
          assert len(tools) > 10, f'Expected >10 tools, got {len(tools)}'
          print(f'OK: {len(tools)} tools registered in fast mode')
          "
