name: Keep Waggle WebMCP warm

on:
  schedule:
    # Render free web services idle after 15 minutes. Offset from the top of
    # the hour to reduce the chance of GitHub Actions schedule congestion.
    - cron: "3/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-waggle-webmcp-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake and verify Waggle API
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 10 --retry-all-errors \
            --connect-timeout 20 --max-time 120 \
            https://waggle-webmcp-api.onrender.com/health/ready

      - name: Verify public workspace
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --connect-timeout 20 --max-time 60 \
            https://waggle-webmcp.onrender.com/ > /dev/null
