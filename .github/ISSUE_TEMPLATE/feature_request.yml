name: Feature request
description: Propose a new capability or improvement.
title: "[feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Before you submit:
        - install Waggle from PyPI: https://pypi.org/project/waggle-mcp/
        - install the VS Code extension: https://marketplace.visualstudio.com/items?itemName=Abhigyan-Shekhar.waggle-memory
        - attach a screenshot or mockup when it helps explain the issue, gap, or requested UX

        Screenshots and mockups are encouraged when they help clarify the request, but they are not required for every feature request.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do that Waggle does not support well today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the change you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds, related tools, or reasons this should not be done another way.
  - type: textarea
    id: scope
    attributes:
      label: Suggested implementation scope
      description: Mention likely files, modules, or commands if you know them.
      placeholder: src/waggle/server.py, docs/install/, tests/test_server.py
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or mockup (optional)
      description: Optional. Include a screenshot or mockup when it helps clarify the request.
      placeholder: Paste the screenshot link or drag the image into the issue body.
