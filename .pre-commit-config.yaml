repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      # Lint first, then format (order matters)
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: debug-statements
  - repo: local
    hooks:
      - id: no-print-in-src
        name: No print() in src/
        entry: bash -c 'if grep -rn "^[^#]*print(" src/waggle/ --include="*.py" | grep -v "# CLI output"; then echo "Use logger instead of print() in src/"; exit 1; fi'
        language: system
        pass_filenames: false
