services:
  - type: web
    name: waggle-webmcp-demo
    runtime: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /health/ready
    disk:
      name: waggle-webmcp-demo-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: WAGGLE_TRANSPORT
        value: http
      - key: WAGGLE_BACKEND
        value: sqlite
      - key: WAGGLE_DB_PATH
        value: /data/waggle-webmcp-demo.db
      - key: WAGGLE_HTTP_HOST
        value: 0.0.0.0
      - key: WAGGLE_DEMO_MODE
        value: true
      - key: WAGGLE_DEMO_COOKIE_SECURE
        value: true
      - key: WAGGLE_API_KEY_ENVIRONMENT
        value: live
      - key: WAGGLE_LOG_LEVEL
        value: INFO
