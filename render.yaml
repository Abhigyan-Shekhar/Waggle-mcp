services:
  - type: web
    name: waggle-webmcp-api
    runtime: docker
    plan: free
    branch: codex/waggle-webmcp
    autoDeploy: false
    healthCheckPath: /health/ready
    envVars:
      - key: WAGGLE_TRANSPORT
        value: http
      - key: WAGGLE_BACKEND
        value: sqlite
      - key: WAGGLE_MODEL
        value: deterministic
      - key: WAGGLE_DB_PATH
        value: /data/waggle-webmcp-demo.db
      - key: WAGGLE_HTTP_HOST
        value: 0.0.0.0
      - key: WAGGLE_DEMO_MODE
        value: true
      - key: WAGGLE_DEMO_COOKIE_SECURE
        value: true
      - key: WAGGLE_DEMO_FRONTEND_ORIGIN
        value: https://waggle-webmcp.onrender.com
      - key: WAGGLE_API_KEY_ENVIRONMENT
        value: live
      - key: WAGGLE_LOG_LEVEL
        value: INFO
  - type: web
    name: waggle-webmcp
    runtime: static
    plan: free
    branch: codex/waggle-webmcp
    autoDeploy: false
    buildCommand: npm ci --prefix apps/mcp/graph-ui && npm run build --prefix apps/mcp/graph-ui
    staticPublishPath: src/waggle/static/graph
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
