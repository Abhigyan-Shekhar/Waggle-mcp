name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Validate YAML
        run: yamllint .

      - name: Lint Python
        run: ruff check scripts tests

      - name: Check runner types
        run: mypy scripts/run_action.py

      - name: Run unit and metadata tests
        run: pytest tests/test_runner.py tests/test_action_metadata.py -q

      - name: Run offline fixture integration proof
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: pytest tests/test_integration.py -vv -s
